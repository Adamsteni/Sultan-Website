[build]
  command = "npm run vendor"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # The browser modules under public/js are pulled into the function bundle transitively, and
  # esbuild compiles them as CommonJS, where top-level await is a syntax error. They are loaded
  # natively by <script type="module">, so shipping them raw keeps their native ESM behaviour
  # and their top-level await.
  included_files = []

# The Express app runs as a function; static files are served from public/ by the CDN.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Keep client-side paths tidy: /checkout and /account reach their html files.
[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 301
  force = true

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301
  force = true

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
