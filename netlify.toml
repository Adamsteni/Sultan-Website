[build]
  command = "npm run vendor"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The Express app runs as a function; static files are served from public/ by the CDN.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Keep client-side paths tidy: /checkout and /account reach their html files.
[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 301
  force = true

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301
  force = true

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
